name: OS settings preview release

on:
  push:
    branches:
      - preview/os-settings-release
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: os-settings-preview-release
  cancel-in-progress: false

env:
  SOURCE_SHA: fe76090f08eefd38bf90bf4328c09d301e44b64a
  RELEASE_TAG: os-settings-preview-fe76090f0

jobs:
  macos-arm64:
    name: macOS ARM64
    runs-on: macos-15
    timeout-minutes: 90
    env:
      npm_config_arch: arm64
      VSCODE_ARCH: arm64
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Check out preview source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: |
          python3 -m pip install --break-system-packages setuptools
          npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download built-in extensions
        run: node build/lib/builtInExtensions.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Code - OSS
        run: npm run gulp vscode-darwin-arm64-min
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ad-hoc sign and archive
        run: |
          codesign --force --deep --sign - "../VSCode-darwin-arm64/Code - OSS.app"
          codesign --verify --deep --strict "../VSCode-darwin-arm64/Code - OSS.app"
          ditto -c -k --sequesterRsrc --keepParent \
            "../VSCode-darwin-arm64/Code - OSS.app" \
            "Code-OSS-os-settings-preview-macos-arm64.zip"

      - name: Upload macOS package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: os-settings-preview-macos-arm64
          path: Code-OSS-os-settings-preview-macos-arm64.zip
          if-no-files-found: error

  windows-x64:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      npm_config_arch: x64
      VSCODE_ARCH: x64
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Check out preview source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Add Windows SDK tools to PATH
        shell: pwsh
        run: |
          $sdkRoot = 'C:\Program Files (x86)\Windows Kits\10\bin'
          $signTool = Get-ChildItem $sdkRoot -Filter signtool.exe -Recurse -File |
            Where-Object { $_.Directory.Name -eq 'x64' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) { throw 'The x64 Windows SDK signtool.exe was not found.' }
          $signTool.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Using Windows SDK tools from $($signTool.DirectoryName)"

      - name: Install dependencies
        shell: pwsh
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download built-in extensions
        shell: pwsh
        run: node build/lib/builtInExtensions.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Code - OSS
        shell: pwsh
        run: npm run gulp vscode-win32-x64-min
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build unsigned user installer
        shell: pwsh
        run: npm run gulp vscode-win32-x64-user-setup

      - name: Archive Windows packages
        shell: pwsh
        run: |
          7z.exe a -tzip "$env:GITHUB_WORKSPACE\Code-OSS-os-settings-preview-windows-x64.zip" "..\VSCode-win32-x64\*"
          Copy-Item ".build\win32-x64\user-setup\VSCodeSetup.exe" "Code-OSS-os-settings-preview-windows-x64-setup.exe"

      - name: Upload Windows packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: os-settings-preview-windows-x64
          path: |
            Code-OSS-os-settings-preview-windows-x64.zip
            Code-OSS-os-settings-preview-windows-x64-setup.exe
          if-no-files-found: error

  release:
    name: Publish preview release
    needs:
      - macos-arm64
      - windows-x64
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: os-settings-preview-*
          path: dist
          merge-multiple: true

      - name: Generate checksums and release notes
        shell: bash
        run: |
          cd dist
          sha256sum Code-OSS-* > SHA256SUMS.txt
          cd ..
          cat > release-notes.md <<'EOF'
          Preview build for microsoft/vscode#335281: OS-specific settings in settings.json.

          Source commit: fe76090f08eefd38bf90bf4328c09d301e44b64a

          Packages:
          - macOS ARM64: `Code-OSS-os-settings-preview-macos-arm64.zip`
          - Windows x64 portable: `Code-OSS-os-settings-preview-windows-x64.zip`
          - Windows x64 installer: `Code-OSS-os-settings-preview-windows-x64-setup.exe`

          These are unofficial Code - OSS preview builds. They are not Microsoft Visual Studio Code releases. The macOS app is ad-hoc signed but not notarized, and the Windows packages are unsigned, so the operating system may display a security warning.

          The Visual Studio Marketplace is not included in Code - OSS. Extensions can be installed from VSIX files.
          EOF

      - name: Create or update prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md --prerelease
          else
            gh release create "$RELEASE_TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" \
              --title "OS settings preview ($SOURCE_SHA)" \
              --notes-file release-notes.md \
              --prerelease
          fi
